name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      libsmb2_scripts_run:
        description: libsmb2-scripts run whose libsmb2-release artifact the jobs bundle (empty for the repository variable, else the Build found by itself)
        type: string
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The jobs that bundle libsmb2 take the release pinned in hook/build.dart,
# libsmb2-rN. While it is not published, the libsmb2 job finds the
# libsmb2-scripts Build that made it, once for every job: the latest
# successful run of build.yml started by a push to a release/ branch whose
# scripts/shared/_versions.sh builds rN (.github/scripts/
# resolve_libsmb2_run.sh). The jobs then take that run's libraries instead
# of the pinned release (see .github/actions/libsmb2-from-run). Once
# libsmb2-rN is out the pinned release serves. Nothing is set by hand:
# pin the release with tool/update_libsmb2.sh rN <the run's manifest.json>
# before publishing it.
#
# Reading the Builds and their artifacts needs the secret
# LIBSMB2_SCRIPTS_TOKEN: a fine-grained token with Actions read access on
# ales-drnz/libsmb2-scripts only, renewed before the expiry date chosen
# when it was made. The libsmb2 job checks the token, the run and the
# pinned release before anything else starts (.github/scripts/preflight.sh).
#
# To force a Build, the input libsmb2_scripts_run of a run started by hand
# names it for that run, and the repository variable LIBSMB2_SCRIPTS_RUN
# for every run while it is set (the input wins). Neither is needed
# otherwise: leave the variable unset, since run artifacts expire after 90
# days.

jobs:
  # The libsmb2-scripts Build the jobs bundle, if the pinned release is not
  # published: found once here, for every job, and checked before anything
  # else starts.
  libsmb2:
    name: libsmb2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      # The libsmb2-scripts run the jobs bundle, empty for the pinned release.
      run: ${{ steps.resolve.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The scripts below, against a fake gh (test/ci).
      - name: CI script tests
        run: for t in test/ci/*_test.sh; do bash "$t"; done
      - name: libsmb2-scripts run
        id: resolve
        env:
          LIBSMB2_SCRIPTS_RUN: ${{ inputs.libsmb2_scripts_run || vars.LIBSMB2_SCRIPTS_RUN }}
          GH_TOKEN: ${{ secrets.LIBSMB2_SCRIPTS_TOKEN }}
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          run="$(.github/scripts/resolve_libsmb2_run.sh)"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      # The libsmb2 the jobs will bundle must be there: one error here
      # instead of each job failing on its own, minutes in.
      - name: Preflight
        env:
          GH_TOKEN: ${{ github.token }}
          LIBSMB2_SCRIPTS_RUN: ${{ steps.resolve.outputs.run }}
          LIBSMB2_SCRIPTS_TOKEN: ${{ secrets.LIBSMB2_SCRIPTS_TOKEN }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: .github/scripts/preflight.sh

  analyze:
    name: Analyze (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the current stable.
        sdk: ['3.10.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - name: Format
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test example hook tool test_app/lib test_app/integration_test test_app/test_driver
      - name: Publish dry run
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run
      - name: Doc dry run
        if: matrix.sdk == 'stable'
        run: dart doc --dry-run

  # The generated bindings match libsmb2's patched headers at the commit
  # the pinned release was built from: types and struct layouts, not only
  # the function names tool/bindings_drift.dart checks.
  bindings:
    name: Bindings
    needs: libsmb2
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
      - name: Patched headers of the pinned release
        run: |
          commit="$(jq -r .source.commit tool/libsmb2_manifest.json)"
          # No checkout of the default branch: its tree may not switch
          # cleanly to the pinned commit.
          git clone --quiet --no-checkout https://github.com/ales-drnz/libsmb2-scripts ../libsmb2-scripts
          git -C ../libsmb2-scripts checkout --quiet "$commit"
          (cd ../libsmb2-scripts && ./build sources)
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: ./.github/actions/libsmb2-from-run
        with:
          run-id: ${{ needs.libsmb2.outputs.run }}
          token: ${{ secrets.LIBSMB2_SCRIPTS_TOKEN }}
          pubspecs: pubspec.yaml
      - run: dart pub get
      - name: Regenerate and compare
        run: |
          dart run tool/ffigen.dart
          git diff --exit-code lib/src/ffi/libsmb2.g.dart
      - run: dart run tool/bindings_drift.dart ../libsmb2-scripts

  test:
    name: Test (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    needs: libsmb2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The hook bundles libsmb2 for dart test: the Linux .so, the macOS
        # slice thinned from the xcframework, the Windows DLL. The arm
        # runners load the aarch64 .so and the arm64 DLL.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025, windows-11-arm]
        sdk: [stable]
        include:
          # The declared floor, on one OS.
          - os: ubuntu-24.04
            sdk: '3.10.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - uses: ./.github/actions/libsmb2-from-run
        with:
          run-id: ${{ needs.libsmb2.outputs.run }}
          token: ${{ secrets.LIBSMB2_SCRIPTS_TOKEN }}
          pubspecs: pubspec.yaml
      - name: Keep core dumps
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%p
      - name: dart test
        shell: bash
        run: |
          ulimit -c unlimited 2>/dev/null || true
          dart test
      - name: Native backtraces of crashed test processes
        if: failure() && runner.os == 'Linux'
        run: |
          ls /tmp/cores/core.* >/dev/null 2>&1 || { echo "no core dumps"; exit 0; }
          sudo apt-get install -y gdb
          vm="$(dirname "$(command -v dart)")/dartvm"
          [ -x "$vm" ] || vm="$(command -v dart)"
          for core in /tmp/cores/core.*; do
            echo "::group::$core"
            gdb -batch -ex 'info sharedlibrary' -ex 'thread apply all bt 25' "$vm" "$core" 2>&1 | grep -v '^\[New LWP'
            echo "::endgroup::"
          done

  # The suites under test/integration against a real Samba in Docker.
  integration:
    name: Integration (Samba)
    needs: libsmb2
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
      - uses: ./.github/actions/libsmb2-from-run
        with:
          run-id: ${{ needs.libsmb2.outputs.run }}
          token: ${{ secrets.LIBSMB2_SCRIPTS_TOKEN }}
          pubspecs: pubspec.yaml
      - name: Start Samba and seed the share
        run: dart run test/integration/bootstrap.dart
      - name: dart test -P integration
        run: dart test -P integration test/integration
      - name: Samba logs
        if: failure()
        run: docker logs dart-smb2-test

  # test_app/integration_test on every platform, as an app runs it: the
  # library the hook bundles loads on the device and the pool drives it.
  # Android and Linux also run the server group, against the Samba
  # container (from the Android emulator, the host's loopback is
  # 10.0.2.2); the macOS and Windows runners cannot run Linux containers,
  # so they and the iOS simulator run the offline group.
  device:
    name: Device ${{ matrix.name }}
    needs: libsmb2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-24.04
            server: '10.0.2.2'
          - name: Linux
            os: ubuntu-24.04
            server: '127.0.0.1'
          - name: macOS
            os: macos-26
          - name: iOS
            os: macos-26
          - name: Windows
            os: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.name == 'Android'
        with:
          distribution: temurin
          java-version: '17'
          # Gradle's distribution and dependencies, so a build does not
          # hang on a download of them. The key is test_app's Gradle files.
          cache: gradle
          cache-dependency-path: |
            test_app/android/*.gradle*
            test_app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - uses: ./.github/actions/libsmb2-from-run
        with:
          run-id: ${{ needs.libsmb2.outputs.run }}
          token: ${{ secrets.LIBSMB2_SCRIPTS_TOKEN }}
          # The package's own too: the Samba bootstrap runs from its root.
          pubspecs: pubspec.yaml test_app/pubspec.yaml
      - name: Start Samba and seed the share
        if: matrix.server
        run: |
          dart pub get
          dart run test/integration/bootstrap.dart
      - name: Install Linux build dependencies
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - name: Enable KVM
        if: matrix.name == 'Android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
        working-directory: test_app
      - run: flutter analyze
        if: matrix.name == 'Linux'
        working-directory: test_app
      - name: Integration tests (Android emulator)
        if: matrix.name == 'Android'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: test_app
          script: flutter test integration_test -d emulator-5554 --dart-define=SMB2_TEST_HOST=${{ matrix.server }}
      - name: Integration tests (Linux)
        if: matrix.name == 'Linux'
        working-directory: test_app
        run: xvfb-run -a flutter test integration_test -d linux --dart-define=SMB2_TEST_HOST=${{ matrix.server }}
      - name: Integration tests (macOS)
        if: matrix.name == 'macOS'
        working-directory: test_app
        run: flutter test integration_test -d macos
      - name: Integration tests (iOS simulator)
        if: matrix.name == 'iOS'
        working-directory: test_app
        timeout-minutes: 30
        # A watchdog retries when flutter test misses the app on the
        # simulator (flutter/flutter#181771); see the script.
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r,v in d.items() if "iOS" in r for x in v if x["name"].startswith("iPhone")))')"
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          bash ../.github/scripts/ios_integration_tests.sh "$udid"
      - name: Simulator log
        if: failure() && matrix.name == 'iOS'
        run: xcrun simctl spawn "$UDID" log show --last 15m --style compact --predicate 'process == "Runner"' | tail -200
      - name: Integration tests (Windows)
        if: matrix.name == 'Windows'
        working-directory: test_app
        shell: bash
        run: flutter test integration_test -d windows
      - name: Samba logs
        if: failure() && matrix.server
        run: docker logs dart-smb2-test

  # A throwaway Flutter app on each platform: the hook must bundle libsmb2
  # under the package's own name.
  build:
    name: Build ${{ matrix.name }}
    needs: libsmb2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-24.04
            platform: android
            command: >-
              flutter build apk --debug &&
              test "$(unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep -c 'lib/.*/libdart_smb2.so')" = 3
          - name: Linux
            os: ubuntu-24.04
            platform: linux
            command: >-
              flutter build linux --debug &&
              test -f build/linux/x64/debug/bundle/lib/libdart_smb2.so
          - name: Windows
            os: windows-2025
            platform: windows
            command: >-
              flutter build windows --debug &&
              find build/windows -name dart_smb2.dll | grep -q .
          - name: macOS
            os: macos-26
            platform: macos
            command: >-
              flutter build macos --debug &&
              test -f build/macos/Build/Products/Debug/smb2_ci_app.app/Contents/Frameworks/libdart_smb2.framework/libdart_smb2
          - name: iOS
            os: macos-26
            platform: ios
            command: >-
              flutter build ios --simulator --debug &&
              test -f build/ios/iphonesimulator/Runner.app/Frameworks/libdart_smb2.framework/libdart_smb2
          # The device slice of the xcframework, which no simulator loads.
          - name: iOS device
            os: macos-26
            platform: ios
            command: >-
              flutter build ios --debug --no-codesign &&
              test -f build/ios/iphoneos/Runner.app/Frameworks/libdart_smb2.framework/libdart_smb2 &&
              test "$(lipo -archs build/ios/iphoneos/Runner.app/Frameworks/libdart_smb2.framework/libdart_smb2)" = arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.name == 'Android'
        with:
          distribution: temurin
          java-version: '17'
          # Gradle's distribution and dependencies, so a build does not
          # hang on a download of them. The key is test_app's Gradle files.
          cache: gradle
          cache-dependency-path: |
            test_app/android/*.gradle*
            test_app/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Create the app
        shell: bash
        run: |
          flutter create --platforms=${{ matrix.platform }} --project-name smb2_ci_app "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          # A path pub reads on Windows too (D:/a/..., not /d/a/...).
          workspace="$(cygpath -m "$GITHUB_WORKSPACE" 2>/dev/null || echo "$GITHUB_WORKSPACE")"
          flutter pub add "dart_smb2:{\"path\":\"$workspace\"}"
          cat > lib/main.dart <<'DART'
          import 'package:dart_smb2/dart_smb2.dart';
          import 'package:flutter/widgets.dart';

          void main() => runApp(
            Text('${Smb2Client().isConnected}', textDirection: TextDirection.ltr),
          );
          DART
          rm -rf test
      - uses: ./.github/actions/libsmb2-from-run
        with:
          run-id: ${{ needs.libsmb2.outputs.run }}
          token: ${{ secrets.LIBSMB2_SCRIPTS_TOKEN }}
          pubspecs: ${{ runner.temp }}/app/pubspec.yaml
      - name: Build
        shell: bash
        working-directory: ${{ runner.temp }}/app
        run: ${{ matrix.command }}
