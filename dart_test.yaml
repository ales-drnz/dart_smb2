# The integration suites need the Samba container (test/integration/README.md),
# so a plain `dart test` skips them. Run everything, one file at a time,
# with:
#
#     dart test -P integration
#
# and only the integration suites with `dart test -P integration
# test/integration`.
tags:
  integration:
    skip: 'needs the Samba container: run with -P integration'

presets:
  integration:
    concurrency: 1
    tags:
      integration:
        skip: false
